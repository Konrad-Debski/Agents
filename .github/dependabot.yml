# Opens update pull requests. Synchronization installs updates after they merge into main.
version: 2
updates:
  # Each upstream source gets its own pull request and CI run.
  - package-ecosystem: gitsubmodule
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ['*']
    commit-message:
      prefix: ci
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope
  - package-ecosystem: pip
    directory: /tests
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      pip:
        patterns: ['*']
    commit-message:
      prefix: chore
      include: scope
