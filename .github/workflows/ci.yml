name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache-dependency-path: scripts/quality/install-tools.sh
      - run: python -m pip install -r tests/requirements.txt
      - name: Install quality tools
        run: |
          bash scripts/quality/install-tools.sh "$RUNNER_TEMP/agents-tools"
          echo "$RUNNER_TEMP/agents-tools" >> "$GITHUB_PATH"
      - run: bash scripts/check.sh static
      - run: bash scripts/check.sh repository
      - name: Scan new commit history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check.sh secrets "${BASE_SHA:-origin/main}" HEAD

      - name: Integration tests
        run: bash scripts/check.sh tests
