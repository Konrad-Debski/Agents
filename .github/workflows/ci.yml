name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.x'
          check-latest: true
      - name: Resolve latest Gitleaks
        id: gitleaks
        run: |
          version=$(curl -fsSL https://proxy.golang.org/github.com/zricethezav/gitleaks/v8/@latest | python -c 'import json, sys; print(json.load(sys.stdin)["Version"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v5
        id: gitleaks-cache
        with:
          path: ${{ runner.temp }}/agents-tools/gitleaks
          key: gitleaks-${{ runner.os }}-${{ runner.arch }}-${{ steps.gitleaks.outputs.version }}-${{ hashFiles('scripts/quality/install-tools.sh') }}
      - uses: actions/setup-go@v7
        if: steps.gitleaks-cache.outputs.cache-hit != 'true'
        with:
          go-version: stable
          cache: false
      - run: python -m pip install -r tests/requirements.txt
      - name: Install quality tools
        env:
          GITLEAKS_VERSION: ${{ steps.gitleaks.outputs.version }}
          GITLEAKS_CACHE_HIT: ${{ steps.gitleaks-cache.outputs.cache-hit }}
        run: |
          if [[ $GITLEAKS_CACHE_HIT == true ]]; then
            cd "$RUNNER_TEMP"
            curl -fsSLo download-actionlint.bash https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash
            bash download-actionlint.bash latest "$RUNNER_TEMP/agents-tools"
          else
            bash scripts/quality/install-tools.sh "$RUNNER_TEMP/agents-tools"
          fi
          echo "$RUNNER_TEMP/agents-tools" >> "$GITHUB_PATH"
      - run: bash scripts/check.sh static
      - run: bash scripts/check.sh repository
      - name: Scan new commit history
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check.sh secrets "${BASE_SHA:-origin/main}" HEAD

      - name: Integration tests
        run: |
          command -v systemd-analyze
          bash scripts/check.sh tests
