name: PR policy

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-policy:
    # Dependabot sets its own branch names and commit bodies; a skipped required job counts as passed.
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: python3 scripts/quality/pr_policy.py
      - name: Check new commit messages
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/check.sh commits "$BASE_SHA" HEAD
